[project]
name = "event-build"
version = "0.1.0"
description = "Build a verified event record from a video (states, transitions, units, anchors, gates)."
requires-python = ">=3.10"
dependencies = [
  "pillow>=10.0",
  "numpy>=1.24",
  "imagehash>=4.3",
  "rapidocr>=3.0",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.1",
  "nvidia-cublas-cu12; platform_system == 'Windows'",
]
dev = ["pytest>=8.0"]
office = ["python-docx>=1.1", "openpyxl>=3.1"]

[project.scripts]
event-build = "event_build.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
event_build = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
