[project]
name = "event-build"
version = "0.2.0"
description = "Turn long videos into verifiable event records: states, speech units, chapters, attention and review flags, all timestamped."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "xinghuobk" }]
keywords = ["video", "event-record", "multimodal", "transcription", "ocr", "screen-recording", "dsh"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pillow>=10.0",
  "numpy>=1.24",
  "imagehash>=4.3",
  "rapidocr>=3.0",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.1",
  "nvidia-cublas-cu12; platform_system == 'Windows'",
]
dev = ["pytest>=8.0"]
office = ["python-docx>=1.1", "openpyxl>=3.1"]

[project.urls]
Homepage = "https://github.com/xinghuobk/dsh-event-video"
Repository = "https://github.com/xinghuobk/dsh-event-video"
Issues = "https://github.com/xinghuobk/dsh-event-video/issues"

[project.scripts]
event-build = "event_build.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
event_build = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
