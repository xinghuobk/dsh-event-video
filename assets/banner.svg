      <stop offset="0" stop-color="#0f1220"/>
      <stop offset="1" stop-color="#1b2040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#52c7bd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g opacity="0.25">
    <rect x="60" y="220" width="120" height="14" rx="7" fill="#7c8cff"/>
    <rect x="196" y="220" width="48" height="14" rx="7" fill="#52c7bd"/>
