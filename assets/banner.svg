  <text x="60" y="112" fill="#ffffff" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="54" font-weight="700" letter-spacing="-1">DSH Event Video</text>
  <text x="60" y="158" fill="url(#accent)" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="600">Every second, accounted for.  每一秒，都有据可查。</text>
  <text x="60" y="196" fill="#9aa4c7" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="19">Turn long videos into verifiable event records — states, words, chapters, review flags, all anchored to timestamps.</text>
